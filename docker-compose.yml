# roshanavi services
#   lab  : API/web server on 127.0.0.1:8080
#   demo : demo_nodes_py talker + listener (same ROS_DOMAIN_ID / network)
#   test : build + full pytest suite (exit code = result)
#   e2e  : Playwright smoke test against a running `lab` + `demo` (profile e2e)

x-ros: &ros
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: roshanavi:dev
  init: true
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    PYTHONUNBUFFERED: "1"

services:
  lab:
    <<: *ros
    environment:
      <<: *ros-env
      ROSHANAVI_BUILD: "1"
    volumes:
      - ./ros2_ws/src:/ws/src:ro
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
    # Launcher workspace = /ws (cwd); the project file lives in ./data to survive restarts.
    command: ["ros2", "run", "roshanavi", "server", "--host", "0.0.0.0", "--port", "8080",
              "--data-dir", "/data", "--project", "/data/roshanavi.yaml"]

  demo:
    <<: *ros
    command: ["bash", "-c",
              "ros2 run demo_nodes_py talker & ros2 run demo_nodes_py listener & wait"]

  test:
    <<: *ros
    profiles: ["test"]
    environment:
      <<: *ros-env
      ROSHANAVI_BUILD: "1"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ./ros2_ws/src:/ws/src:ro
    command: ["python3", "-m", "pytest", "-p", "no:cacheprovider", "-q", "/ws/src/roshanavi/test"]

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    network_mode: host  # reaches the lab UI published on 127.0.0.1:8080
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      ROSHANAVI_URL: ${ROSHANAVI_URL:-http://localhost:8080}
    working_dir: /repo/web
    volumes:
      - .:/repo
    command: ["npx", "playwright", "test"]
