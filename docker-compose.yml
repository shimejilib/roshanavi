# roshanavi services
#   lab  : API/web server on 127.0.0.1:6871
#   demo : nodes roshanavi did NOT start (external_talker / external_listener on
#          /external/chatter, and the lifecycle node lc_talker which starts
#          unconfigured); the demo talker / listener are started by `lab` itself
#          from examples/demo_project (copied to ./data/roshanavi.yaml if absent)
#   test : build + C++ probe unit tests (gtest) + full pytest suite (exit code = result)
#   lab-e2e / demo-e2e / e2e (profile e2e): an isolated copy of the stack for Playwright, on its
#          own ROS_DOMAIN_ID with a fresh tmpfs /data (nothing mounted from ./data), not published.
#          Its workspace src is a fresh tmpfs too (the repo's packages are mounted read-only inside
#          it at /ws/src/repo), shared with the Playwright runner, so 「ひな形を作る」 can write a
#          package and the test can edit it (docs/design/user-code.md). Run it all with
#          scripts/e2e.sh
# ROS_DISTRO (host env, default jazzy) selects the ROS 2 distro: jazzy / lyrical (official),
# kilted (verified once). e.g. `ROS_DISTRO=lyrical docker compose --profile test run --rm test`.

x-ros: &ros
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
  # One image per distro, so a lyrical run never replaces the jazzy image the lab uses.
  # ROSHANAVI_IMAGE overrides the tag (a git worktree builds its own image next to the lab's).
  image: ${ROSHANAVI_IMAGE:-roshanavi:dev-${ROS_DISTRO:-jazzy}}
  init: true
  # LTTng's per-CPU ring buffers (詳細計測モード) and Fast DDS's shared-memory transport both
  # live in /dev/shm; Docker's default 64 MB is too small for 4 MiB x many CPUs.
  shm_size: 512m
  environment: &ros-env
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    PYTHONUNBUFFERED: "1"

services:
  lab:
    <<: *ros
    environment:
      <<: *ros-env
      ROSHANAVI_BUILD: "1"
    volumes:
      - ./ros2_ws/src:/ws/src:ro
      - ./data:/data
      - ./examples:/examples:ro
    ports:
      - "127.0.0.1:6871:6871"
    # Launcher workspace = /ws (cwd); the project file lives in ./data to survive restarts.
    command: ["ros2", "run", "roshanavi", "server", "--host", "0.0.0.0", "--port", "6871",
              "--data-dir", "/data", "--project", "/data/roshanavi.yaml",
              "--project-template", "/examples/demo_project/roshanavi.yaml"]

  demo:
    <<: *ros
    command: ["bash", "-c",
              "ros2 run demo_nodes_cpp talker --ros-args -r __node:=external_talker
               -r chatter:=/external/chatter &
               ros2 run demo_nodes_cpp listener --ros-args -r __node:=external_listener
               -r chatter:=/external/chatter &
               ros2 run lifecycle lifecycle_talker & wait"]

  test:
    <<: *ros
    profiles: ["test"]
    environment:
      <<: *ros-env
      ROSHANAVI_BUILD: "1"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    volumes:
      - ./ros2_ws/src:/ws/src:ro
      - ./examples:/examples:ro
    command: ["bash", "-c",
              "/ws/build/roshanavi_probe/test_stats --gtest_brief=1 &&
               /ws/build/roshanavi_examples/test_image_ops --gtest_brief=1 &&
               /ws/build/roshanavi_examples/test_pipeline_logic --gtest_brief=1 &&
               python3 -m pytest -p no:cacheprovider -q /ws/src/roshanavi/test"]

  lab-e2e:
    <<: *ros
    profiles: ["e2e"]
    environment:
      <<: *ros-env
      ROS_DOMAIN_ID: ${E2E_ROS_DOMAIN_ID:-77}
      ROSHANAVI_BUILD: "1"
    volumes:
      - e2e-src:/ws/src       # writable workspace src (scaffold); shared with the e2e runner
      - ./ros2_ws/src:/ws/src/repo:ro
      - ./examples:/examples:ro
      - e2e-media:/data/e2e   # clips the media test writes; shared with the e2e runner
    tmpfs:
      - /data                 # fresh project / recordings every run, seeded from the template
    expose: ["6871"]          # compose network only, never published to the host
    # umask 0000: the scaffolded files (written as root) stay editable by the runner's user.
    command: ["bash", "-c",
              "umask 0000 && exec ros2 run roshanavi server --host 0.0.0.0 --port 6871
               --data-dir /data --project /data/roshanavi.yaml
               --project-template /examples/demo_project/roshanavi.yaml --allowed-host lab-e2e"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6871/api/health"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  demo-e2e:
    <<: *ros
    profiles: ["e2e"]
    environment:
      <<: *ros-env
      ROS_DOMAIN_ID: ${E2E_ROS_DOMAIN_ID:-77}
    command: ["bash", "-c",
              "ros2 run demo_nodes_cpp talker --ros-args -r __node:=external_talker
               -r chatter:=/external/chatter &
               ros2 run demo_nodes_cpp listener --ros-args -r __node:=external_listener
               -r chatter:=/external/chatter &
               ros2 run lifecycle lifecycle_talker & wait"]

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    user: "${UID:-1000}:${GID:-1000}"
    # Share lab-e2e's network namespace: the UI is then http://localhost:6871, a secure context
    # (browser mic / camera capture needs one; http://lab-e2e would not be).
    network_mode: "service:lab-e2e"
    depends_on:
      lab-e2e:
        condition: service_healthy
      demo-e2e:
        condition: service_started
    environment:
      HOME: /tmp
      ROSHANAVI_URL: ${ROSHANAVI_URL:-http://localhost:6871}
      E2E_MEDIA_DIR: /e2e-media
      E2E_WS_SRC: /e2e-ws-src    # lab-e2e's /ws/src
    working_dir: /repo/web
    volumes:
      - .:/repo
      - e2e-media:/e2e-media
      - e2e-src:/e2e-ws-src
    command: ["npx", "playwright", "test"]

volumes:
  e2e-media:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "mode=1777"}
  e2e-src:
    driver: local
    driver_opts: {type: tmpfs, device: tmpfs, o: "mode=1777"}
