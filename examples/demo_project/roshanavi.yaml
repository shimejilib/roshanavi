# roshanavi demo project: copied to the server's project file when none exists yet
# (docker compose `lab`: /data/roshanavi.yaml). Edit it from the web UI.
version: 1
targets:
- id: talker
  kind: run
  package: demo_nodes_cpp
  executable: talker
  name: talker
  role: mine
  autostart: true
- id: listener
  kind: run
  package: demo_nodes_cpp
  executable: listener
  name: listener
  role: dependency
  autostart: true
# Sample nodes (roshanavi_examples, docs/overview/vision.md). Not started automatically: start them from
# the map or the launch list. See examples/perception_demo for a wired-up pipeline.
- id: image_filter
  kind: run
  package: roshanavi_examples
  executable: image_filter
  name: image_filter
  params: {keep_stamp: true, process_delay_ms: 0}
  remaps: {image: /camera/image, image_gray: /camera/gray, image_edges: /camera/edges}
  role: mine
- id: blob_detector
  kind: run
  package: roshanavi_examples
  executable: blob_detector
  name: blob_detector
  params: {threshold: 200, min_area: 30}
  remaps: {image: /camera/gray, detections: /camera/detections}
  role: mine
- id: audio_level
  kind: run
  package: roshanavi_examples
  executable: audio_level
  name: audio_level
  params: {input_type: stamped}
  remaps: {audio: /audio, level_db: /audio/level_db, silence: /audio/silence}
  role: mine
- id: state_machine
  kind: run
  package: roshanavi_examples
  executable: state_machine
  name: state_machine
  remaps: {cmd: /cmd, state: /state}
  role: mine
# A function node (関数ノード, docs/design/nodes.md): the plain Python function shout() of
# roshanavi_examples/logic.py run as a node, /chatter -> /shouted. Start it from the map; edit
# logic.py and save to see it reload.
functions:
- id: text_shout
  name: text_shout
  module: roshanavi_examples.logic
  function: shout
  inputs: [{topic: /chatter, kind: string}]
  output: {topic: /shouted, kind: string}
