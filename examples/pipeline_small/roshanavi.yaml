# pipeline_small: chain 3x1, 3 nodes (1 source, 1 relay, 1 sink), 2 topics, 10 Hz x 1024 B, expected 10 msg/s into the sinks
# Generated by scripts/gen_pipeline.py; one process per node.
version: 1
targets:
- id: src
  kind: run
  package: roshanavi_examples
  executable: pipeline_source
  name: src
  params: {rate_hz: 10.0, payload_bytes: 1024}
  remaps: {out: "/pipe/src"}
  role: dependency
  autostart: true
- id: relay-1
  kind: run
  package: roshanavi_examples
  executable: pipeline_relay
  name: relay_1
  remaps: {in: "/pipe/src", out: "/pipe/relay_1"}
  role: mine
  autostart: true
- id: sink
  kind: run
  package: roshanavi_examples
  executable: pipeline_sink
  name: sink
  remaps: {in: "/pipe/relay_1"}
  role: dependency
  autostart: true
