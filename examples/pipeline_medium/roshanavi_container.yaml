version: 1
targets:
- id: pipeline-medium
  kind: launch
  package: roshanavi_examples
  launch_file: pipeline.launch.py
  args: ["spec:=/examples/pipeline_medium/pipeline.json", "mode:=container", "containers:=1", "container_type:=st", "intra_process:=false"]
  role: mine
  autostart: true
