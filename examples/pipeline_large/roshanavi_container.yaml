# pipeline_large: grid 10x20, 200 nodes (20 source, 160 relay, 20 sink), 360 topics, 10 Hz x 1024 B, expected 200 msg/s into the sinks
# Generated by scripts/gen_pipeline.py; composable container.
version: 1
targets:
- id: pipeline-large
  kind: launch
  package: roshanavi_examples
  launch_file: pipeline.launch.py
  args: ["spec:=/examples/pipeline_large/pipeline.json", "mode:=container", "containers:=1", "container_type:=st", "intra_process:=false"]
  role: mine
  autostart: true
